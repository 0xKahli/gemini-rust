[package]
name = "gemini_client"
version = "1.0.0"
edition = "2021"

[[bin]]
name = "gemini_client"
path = "src/main.rs"

[dependencies]
eframe = "0.30"
egui = "0.30"
egui_commonmark = { version = "0.19", features = ["pulldown_cmark"] }
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
futures-util = "0.3"
oauth2 = "4"
webbrowser = "1"
keyring = "3"
tiny_http = "0.12"
chrono = { version = "0.4", features = ["serde"] }
url = "2"
winreg = "0.50"
image = { version = "0.25", default-features = false, features = ["png"] }
base64 = "0.22"
rfd = "0.15"
arboard = "3.7"
latex-rust = { version = "3.0.3", features = ["png"] }

[build-dependencies]
chrono = "0.4"

[target.'cfg(windows)'.build-dependencies]
winres = "0.1"

[profile.release]
opt-level = 3
lto = true
strip = true
